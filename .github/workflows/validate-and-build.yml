name: Verify and build the Gradio app (manual, no publication)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0 torchvision==0.25.0
          python -m pip install -r requirements-test.txt
      - name: Unit and annotation comparison tests
        run: python -m pytest -q tests/test_adapter.py tests/test_annotations.py
      - name: Download and SHA256-verify the selected original weights
        run: |
          curl --fail --location --retry 3 --output weights/model.safetensors \
            https://huggingface.co/weecology/deepforest-tree/resolve/main/model.safetensors
          echo 'd37a7af0b5ba2754282a80d41b4c7b66e8c7149234df5bf3f41bdaf57d329fc8  weights/model.safetensors' | sha256sum -c -
      - name: CPU inference regressions (1 and 12 windows)
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          RUN_MODEL_TESTS: '1'
          RUN_MULTI_TILE_TESTS: '1'
        run: python -m pytest -q tests/test_integration.py
      - name: Build container locally, without push
        run: docker build --platform linux/amd64 -t tree-crown-explorer:ci .
