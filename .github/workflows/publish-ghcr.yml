name: Publish verified Docker image to GHCR (manual)

# This is the *only* workflow that pushes a package. It never publishes on a git push.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH to authorize a GitHub Container Registry push'
        required: true
        type: string
      version:
        description: 'Version tag for the image, for example v0.1.0'
        required: true
        type: string
        default: 'v0.1.0'

# Keep the default workflow token read-only. Only the publish job may write packages.
permissions:
  contents: read

concurrency:
  group: tree-crown-ghcr-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the source repository
        uses: actions/checkout@v4

      - name: Confirm publication, check branch and validate tag
        id: image
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != 'PUBLISH' ]]; then
            echo 'Not authorized: type PUBLISH in the workflow input.' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Publish from the default branch ($DEFAULT_BRANCH), not $GITHUB_REF_NAME." >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[a-z0-9][a-z0-9_.-]{0,127}$ ]]; then
            echo 'Invalid image version. Use lower-case letters, digits, dot, hyphen or underscore.' >&2
            exit 1
          fi
          IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned CPU PyTorch and test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.10.0 torchvision==0.25.0
          python -m pip install -r requirements-test.txt

      - name: Fast adapter and annotation tests
        run: python -m pytest -q tests/test_adapter.py tests/test_annotations.py

      - name: Obtain and verify the original scientific weights
        run: |
          curl --fail --location --retry 3 \
            --output weights/model.safetensors \
            https://huggingface.co/weecology/deepforest-tree/resolve/main/model.safetensors
          echo 'd37a7af0b5ba2754282a80d41b4c7b66e8c7149234df5bf3f41bdaf57d329fc8  weights/model.safetensors' | sha256sum -c -

      #- name: Regress against original 1-window and 12-window CPU baselines
      #  env:
      #    OMP_NUM_THREADS: '2'
      #    MKL_NUM_THREADS: '2'
      #    RUN_MODEL_TESTS: '1'
      #    RUN_MULTI_TILE_TESTS: '1'
      #  run: python -m pytest -q tests/test_integration.py

      - name: Build the actual runtime Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" .

      - name: Smoke-test the built image as its non-root runtime user
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint python "$IMAGE:$VERSION" -c \
            "from tree_crown_detector import load_model, predict; m = load_model('weights', device='cpu'); r = predict('sample_images/OSBS_029.png', model=m); assert (r['image_width'], r['image_height']) == (400, 400); assert r['n_predictions'] == len(r['predictions']); print('Docker smoke-test predictions:', r['n_predictions'])"

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned and immutable-commit tags
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        shell: bash
        run: |
          set -euo pipefail
          docker tag "$IMAGE:$VERSION" "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:$SHA_TAG"
          {
            echo '### Container publication completed'
            echo "- Version: \`$IMAGE:$VERSION\`"
            echo "- Commit: \`$IMAGE:$SHA_TAG\`"
            echo '- Check the package visibility and repository link in GitHub Packages.'
          } >> "$GITHUB_STEP_SUMMARY"
